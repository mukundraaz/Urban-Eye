version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urbaneye_db
      POSTGRES_USER: urbaneye
      POSTGRES_PASSWORD: urbaneye_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://urbaneye:urbaneye_pass@db:5432/urbaneye_db
      - AI_MODE=demo
      - SECRET_KEY=docker-dev-secret-key-change-in-production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
